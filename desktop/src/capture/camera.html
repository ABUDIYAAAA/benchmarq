<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Local, hidden page that only holds the camera stream. Nothing remote may load here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; media-src 'self' mediastream: blob:; img-src 'self' blob: data:"
    />
    <title>Camera</title>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <script src="camera.js"></script>
  </body>
</html>
